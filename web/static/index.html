<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI News Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Top Nav (rendered by shared.js) -->
  <header class="topbar" id="topbar"></header>

  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <!-- Date Filter -->
      <section class="sidebar-section">
        <div class="date-mode-tabs">
          <button class="date-mode-tab active" data-mode="single">单日</button>
          <button class="date-mode-tab" data-mode="range">范围</button>
        </div>
        <div id="dateSingle" class="date-panel">
          <select id="dateSelect" class="select-input">
            <option value="">All dates</option>
          </select>
        </div>
        <div id="dateRange" class="date-panel hidden">
          <div id="dateRangeChips" class="filter-chips">
            <button class="chip active" data-days="7">7d</button>
            <button class="chip" data-days="14">14d</button>
            <button class="chip" data-days="30">30d</button>
            <button class="chip" data-days="0">All</button>
          </div>
          <div class="date-inputs">
            <input type="date" id="dateFrom" class="select-input">
            <input type="date" id="dateTo" class="select-input">
          </div>
        </div>
      </section>

      <!-- Source Filter -->
      <section class="sidebar-section">
        <h3 class="sidebar-title">Source</h3>
        <div id="sourceFilters" class="filter-chips"></div>
      </section>

      <!-- Category Filter -->
      <section class="sidebar-section">
        <h3 class="sidebar-title">Category</h3>
        <div id="categoryFilters" class="filter-chips"></div>
      </section>

      <!-- Score Filter -->
      <section class="sidebar-section">
        <h3 class="sidebar-title">Min Score</h3>
        <div class="score-slider">
          <input type="range" id="scoreSlider" min="0" max="10" step="0.5" value="0">
          <span id="scoreValue" class="score-label">0</span>
        </div>
      </section>

      <!-- Stats -->
      <section class="sidebar-section" id="statsSection">
        <h3 class="sidebar-title">Stats</h3>
        <div id="statsContent" class="stats-grid"></div>
      </section>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Content theme switcher (AI / Fashion) + header actions -->
      <div class="theme-tab-bar">
        <div class="theme-tabs" role="tablist" aria-label="Content theme">
          <button class="theme-tab active" data-theme="ai" role="tab" aria-selected="true">
            🤖 AI
          </button>
          <button class="theme-tab" data-theme="fashion" role="tab" aria-selected="false">
            👗 时尚
          </button>
        </div>
        <div class="header-actions">
          <button id="btn-add-subscribe" class="btn-primary" type="button">+ 添加订阅</button>
          <a href="/subscribe.html" class="btn-secondary">订阅管理</a>
        </div>
      </div>
      <div class="content-header">
        <div id="resultInfo" class="result-info"></div>
        <button id="sidebarToggle" class="icon-btn sidebar-toggle">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 5a1 1 0 011-1h6a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/></svg>
        </button>
      </div>
      <div id="newsGrid" class="news-grid"></div>
      <div id="pagination" class="pagination"></div>
      <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
      </div>
    </main>
  </div>

  <!-- Subscribe Analyzer Modal -->
  <dialog id="subscribe-modal" class="subscribe-modal">
    <form method="dialog" id="subscribe-form" onsubmit="return false;">
      <h2>添加订阅</h2>

      <div class="modal-state" data-state="input">
        <label for="subscribe-url">粘贴订阅链接（RSS / YouTube / Twitter / Bilibili / 小红书 / 微博）:</label>
        <input type="url" id="subscribe-url" placeholder="https://..." required>
        <div class="modal-actions">
          <button type="button" id="btn-analyze" class="btn-primary">分析</button>
          <button type="button" id="btn-cancel-input" class="btn-tertiary">取消</button>
        </div>
      </div>

      <div class="modal-state" data-state="loading" hidden>
        <div class="spinner"></div>
        <p>正在分析中（抓取样本 + AI 判断），可能需要 5-15 秒...</p>
      </div>

      <div class="modal-state" data-state="result" hidden>
        <div id="result-already-subscribed" hidden>
          <p class="info">✓ 此源已在订阅中。</p>
        </div>
        <div id="result-previously-rejected" hidden>
          <p class="warning">⚠ 你之前拒绝过此源。</p>
          <button type="button" id="btn-reanalyze" class="btn-secondary">重新分析</button>
        </div>

        <div id="result-main">
          <p><strong>已识别：</strong> <span id="r-type"></span></p>

          <h3>样本内容</h3>
          <ul id="r-sample"></ul>

          <h3>AI 建议</h3>
          <p><strong>理由：</strong> <span id="r-reasoning"></span></p>
          <p><strong>质量分：</strong> <span id="r-score"></span> / 10</p>

          <label>主题:
            <select id="r-theme">
              <option value="ai">🤖 AI</option>
              <option value="fashion">👗 时尚</option>
            </select>
          </label>

          <label>focus_area (多选):
            <select id="r-focus-areas" multiple size="4"></select>
          </label>

          <label>源名称:
            <input type="text" id="r-name">
          </label>

          <div class="modal-actions">
            <button type="button" id="btn-confirm-accept" class="btn-primary">确认订阅</button>
            <button type="button" id="btn-confirm-reject" class="btn-secondary">拒绝</button>
            <button type="button" id="btn-cancel" class="btn-tertiary">取消</button>
          </div>
        </div>
      </div>

      <div class="modal-state" data-state="error" hidden>
        <p class="error" id="error-message"></p>
        <div class="modal-actions">
          <button type="button" id="btn-retry" class="btn-primary">重试</button>
          <button type="button" id="btn-cancel-error" class="btn-tertiary">取消</button>
        </div>
      </div>
    </form>
  </dialog>

  <script src="/static/shared.js"></script>
  <script src="/static/ai-panel.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/subscribe-modal.js"></script>
</body>
</html>
