# AI News Aggregator 配置文件

focus_areas:
  - name: "开源模型"
    keywords: ["open source", "开源", "weights release", "model release", "Stable Diffusion", "Flux", "HunyuanVideo", "CogView", "Wan", "LoRA", "Hugging Face"]
  - name: "ComfyUI"
    keywords: ["ComfyUI", "custom node", "workflow", "comfy", "ComfyUI-Manager"]
  - name: "商用产品"
    keywords: ["Lovart", "Gemini", "GPT", "OpenAI", "Claude", "Anthropic", "Midjourney", "DALL-E", "Sora", "Runway"]
  - name: "Agent & Skills"
    keywords: ["agent", "MCP", "mcp-server", "model context protocol", "tool use", "function calling", "autonomous", "agentic", "cursor", "copilot", "claude code", "claude-code", "skills", "coding agent", "vibe-coding", "ai coding"]
  - name: "3D生成与重建"
    keywords: ["gaussian splatting", "3DGS", "4DGS", "NeRF", "neural rendering", "3D reconstruction", "3D generation", "text-to-3d", "point cloud", "mesh generation", "radiance field"]
  - name: "训练与部署"
    keywords: ["fine-tune", "training", "LoRA", "RLHF", "inference", "quantization", "deployment", "distillation"]

sources:
  rss:
    enabled: true
    feeds:
      - { url: "https://openai.com/blog/rss.xml", name: "OpenAI Blog" }
      - { url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic.xml", name: "Anthropic" }
      - { url: "https://blog.google/technology/ai/rss/", name: "Google AI" }
      - { url: "https://huggingface.co/blog/feed.xml", name: "Hugging Face" }
      - { url: "https://blog.google/products/gemini/rss/", name: "Gemini Blog" }
      - { url: "https://www.marktechpost.com/feed/", name: "MarkTechPost AI" }
      # AI + 游戏
      # - { url: "https://inworld.ai/blog/rss.xml", name: "Inworld AI Blog" }  # 无 RSS feed
      - { url: "https://developer.nvidia.com/blog/feed/", name: "NVIDIA Developer Blog" }
      - { url: "https://blogs.unity3d.com/feed/", name: "Unity Blog" }

  github:
    enabled: true
    explosive:
      enabled: true
      lookback_days: 15          # 检测过去 N 天内的爆发式增长
      min_stars: 100             # 最低星数门槛
      top_n: 15                  # 取增长率最高的 N 个
      search_queries:
        # AI 通用
        - "topic:ai"
        - "topic:machine-learning"
        - "topic:llm"
        - "topic:deep-learning"
        - "topic:generative-ai"
        # AI + 图像/视频生成
        - "topic:stable-diffusion"
        - "topic:comfyui"
        - "topic:image-generation"
        - "topic:video-generation"
        - "topic:text-to-video"
        # AI + 游戏
        - "topic:game-ai"
        - "game AI NPC"
        - "AI game development unity unreal godot"
        # AI + 短剧/影视
        - "AI film VFX video-production"
        - "AI animation visual-effects"
        - "AI storytelling short-drama"
        # AI 模型训练
        - "topic:fine-tuning"
        - "topic:lora"
        - "topic:rlhf"
        - "topic:quantization"
        - "topic:vllm"
        - "distributed training deepspeed AI"
        # AI 3D 生成 / Neural Rendering
        - "topic:text-to-3d"
        - "topic:3d-generation"
        - "topic:gaussian-splatting"
        - "topic:3dgs"
        - "topic:neural-rendering"
        - "topic:nerf"
        - "topic:3d-reconstruction"
        - "AI 3D model generation game-ready mesh"
        # AI 游戏工具
        - "AI NPC dialogue game engine"
        - "AI procedural generation game level"
        - "AI motion capture animation"
        # AI Coding Agent / Claude Code 生态
        - "topic:claude-code"
        - "topic:ai-agent"
        - "topic:ai-agents"
        - "topic:ai-coding"
        - "topic:mcp"
        - "topic:mcp-server"
        - "topic:model-context-protocol"
        - "topic:skill"
        - "topic:agentic"
        - "topic:cursor"
        - "topic:copilot"
        - "topic:coding-agent"
        - "\"claude code\" skills OR agent OR plugin"
        - "\"agentic coding\" OR \"AI coding assistant\""
        - "\"claude code\" setup OR workflow OR tools"
        - "awesome claude skills OR mcp-servers"
        - "AI code agent vibe-coding"
    watch_repos:
      - { owner: "comfyanonymous", repo: "ComfyUI" }
      - { owner: "black-forest-labs", repo: "flux" }
